name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # AppSecrets.swift is git-ignored (API address and key); CI builds with the empty template.
      - name: Create AppSecrets from template
        run: cp AppSecrets.swift.example AirRaid/App/Configuration/AppSecrets.swift

      - name: Test WebSocketClient package
        run: swift test --package-path Packages/WebSocketClient

      - name: Build
        run: |
          xcodebuild \
            -project AirRaid.xcodeproj \
            -scheme AirRaid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build
